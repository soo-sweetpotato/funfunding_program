<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>
    <style>
        /* 전체 스타일 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e6f7ff; /* 파스텔 하늘색 배경 */
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* 헤더 스타일 */
        header {
            background-color: #b3e0ff; /* 연한 하늘색 */
            color: white;
            text-align: center;
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        header .logo h1 {
            margin: 0;
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #0073e6; /* 진한 하늘색 */
        }

        header .logo a {
            text-decoration: none;
            color: inherit;
        }

        /* 컨테이너 */
        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.8em;
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* 폼 스타일 */
        form label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #555;
        }

        form input, form textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
        }

        form button {
            background-color: #66b3ff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
        }

        form button:hover {
            background-color: #3399ff;
        }

        /* 하단 링크 */
        .footer {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #0073e6;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <header>
        <div class="logo">
            <a href="{% url 'post_list' %}">
                <h1>FunFunding</h1>
            </a>
        </div>
    </header>

    <!-- 컨테이너 -->
    <div class="container">
        <h1>게시글 작성</h1>
        <form method="POST">
            {% csrf_token %}
            
            <!-- 제목 -->
            <label for="title">제목</label>
            <input type="text" name="title" id="title" placeholder="제목을 입력하세요" required>
            
            <!-- 내용 -->
            <label for="content">내용</label>
            <textarea name="content" id="content" rows="10" placeholder="내용을 입력하세요" required></textarea>
            
            <!-- 가격 -->
            <label for="price">가격</label>
            <input type="number" name="price" id="price" placeholder="가격을 입력하세요" required>
            
            <!-- 모집 인원 -->
            <label for="capacity">모집 인원</label>
            <input type="number" name="capacity" id="capacity" placeholder="모집 인원을 입력하세요" required>
            
            <!-- 작성 버튼 -->
            <button type="submit">작성하기</button>
        </form>

        <!-- 하단 링크 -->
        <div class="footer">
            <a href="{% url 'post_list' %}">목록으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
