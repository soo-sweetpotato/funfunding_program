<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>게시글 삭제</title>
</head>
<body>
    <h1>게시글 삭제</h1>
    <p>"{{ post.title }}" 게시글을 삭제하시겠습니까?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">삭제하기</button>
        <a href="{% url 'post_detail' post.pk %}">취소</a>
    </form>
</body>
</html>
