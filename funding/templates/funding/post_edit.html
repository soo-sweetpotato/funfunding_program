<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 수정</title>
    <style>
        /* 전체 스타일 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e6f7ff;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* 헤더 스타일 */
        header {
            background-color: #b3e0ff;
            color: white;
            text-align: center;
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        header .logo h1 {
            margin: 0;
            font-size: 2em;
            font-weight: bold;
            text-transform: uppercase;
            color: #0073e6;
        }

        header .logo a {
            text-decoration: none;
            color: inherit;
        }

        /* 컨테이너 */
        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        /* 폼 스타일 */
        form label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #555;
        }

        form input, form textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
        }

        form button, a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            background-color: #66b3ff;
            cursor: pointer;
        }

        form button:hover, a:hover {
            background-color: #3399ff;
        }

        a.cancel-button {
            background-color: #b3e0ff;
        }

        a.cancel-button:hover {
            background-color: #66b3ff;
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <header>
        <div class="logo">
            <a href="{% url 'post_list' %}">
                <h1>FunFunding</h1>
            </a>
        </div>
    </header>

    <!-- 컨테이너 -->
    <div class="container">
        <h1>게시글 수정</h1>
        <form method="POST">
            {% csrf_token %}
            <label for="title">제목:</label>
            <input type="text" name="title" id="title" value="{{ post.title }}" required>
            
            <label for="content">내용:</label>
            <textarea name="content" id="content" rows="10" required>{{ post.content }}</textarea>
            
            <button type="submit">수정하기</button>
            <a href="{% url 'post_detail' post.pk %}" class="cancel-button">돌아가기</a>
        </form>
    </div>
</body>
</html>
