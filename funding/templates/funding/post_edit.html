<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
</head>
<body>
    <h1>게시글 수정</h1>
    <form method="POST">
        {% csrf_token %}
        <label>제목:</label><br>
        <input type="text" name="title" value="{{ post.title }}" required><br>
        <label>내용:</label><br>
        <textarea name="content" rows="10" cols="50" required>{{ post.content }}</textarea><br>
        <button type="submit">수정하기</button>
    </form>
    <a href="{% url 'post_detail' post.pk %}">돌아가기</a>
</body>
</html>
