<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>댓글 삭제</title>
</head>
<body>
    <h1>댓글 삭제</h1>
    <p>댓글: {{ comment.content }}</p>
    <p>작성자: {{ comment.user.username }}</p>
    <p>작성일: {{ comment.created_at }}</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">삭제 확인</button>
    </form>
    <a href="{% url 'post_detail' comment.post.pk %}">취소</a>
</body>
</html>
